name: Build and publish Friends

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
    paths:
      - '.github/release-v1.1.51'
  workflow_dispatch:
    inputs:
      version:
        description: 'Версия релиза, например v1.1.49'
        required: true
        type: string

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build installer
        run: npx electron-builder --win nsis --x64 --publish never --config.directories.output=dist
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.version || 'v1.1.51' }}
          generate_release_notes: true
          files: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
